name: movie-ticket

# Toàn bộ hệ thống: 3 hạ tầng + 6 service Spring Boot.
# Chạy:  docker compose up -d --build
# Chỉ cổng 8080 (api-gateway) và 15672 (RabbitMQ UI) lộ ra host.
# Secret đọc từ file .env (xem .env.example). URL nội bộ dùng tên service làm DNS.

x-service-common: &service-common
  restart: unless-stopped
  networks: [movie-network]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- infra
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [movie-network]

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [movie-network]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "15672:15672"   # management UI (demo)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [movie-network]

  # ---------------------------------------------------------------- services
  auth-service:
    <<: *service-common
    build: ./auth-service
    container_name: auth-service
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      AUTH_DB_USERNAME: root
      AUTH_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  catalog-service:
    <<: *service-common
    build: ./catalog-service
    container_name: catalog-service
    environment:
      CATALOG_DB_URL: jdbc:mysql://mysql:3306/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      CATALOG_DB_USERNAME: root
      CATALOG_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      JPA_SHOW_SQL: "false"
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      BOOKING_SERVICE_URL: http://booking-service:8082/api/v1/booking
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  booking-service:
    <<: *service-common
    build: ./booking-service
    container_name: booking-service
    environment:
      BOOKING_DB_URL: jdbc:mysql://mysql:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      BOOKING_DB_USERNAME: root
      BOOKING_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      JPA_SHOW_SQL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8081/api/v1/catalog
      PAYMENT_SERVICE_URL: http://payment-service:8084/api/v1/payment
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  payment-service:
    <<: *service-common
    build: ./payment-service
    container_name: payment-service
    environment:
      PAYMENT_DB_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      PAYMENT_DB_USERNAME: root
      PAYMENT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      JPA_SHOW_SQL: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8083/api/v1/auth
      BOOKING_SERVICE_URL: http://booking-service:8082/api/v1/booking
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_REFUND_ENDPOINT: ${MOMO_REFUND_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/refund}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-http://localhost:3000/payment-result}
      MOMO_NOTIFY_URL: ${MOMO_NOTIFY_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-service:
    <<: *service-common
    build: ./notification-service
    container_name: notification-service
    environment:
      NOTIFICATION_DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      NOTIFICATION_DB_USERNAME: root
      NOTIFICATION_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      JPA_SHOW_SQL: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    networks: [movie-network]
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      AUTH_SERVICE_URI: http://auth-service:8083
      CATALOG_SERVICE_URI: http://catalog-service:8081
      BOOKING_SERVICE_URI: http://booking-service:8082
      PAYMENT_SERVICE_URI: http://payment-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
    depends_on:
      auth-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

networks:
  movie-network:
    driver: bridge

volumes:
  mysql-data:
