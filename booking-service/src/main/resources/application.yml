server:
  port: ${BOOKING_SERVICE_PORT:8082}

spring:
  application:
    name: booking-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  gateway-secret: ${GATEWAY_SECRET}
  internal-secret: ${INTERNAL_SECRET}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8081/api/v1/catalog}