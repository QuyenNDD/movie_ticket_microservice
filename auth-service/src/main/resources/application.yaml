server:
  port: ${AUTH_SERVICE_PORT:8083}

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  movie:
    jwt:
      secret: ${JWT_SECRET}
      expirationMs: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  internal-secret: ${INTERNAL_SECRET:dev-internal-secret}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  password-reset-expiration-ms: ${PASSWORD_RESET_EXPIRATION_MS:900000}
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  email-verification-expiration-ms: ${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
  email-verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
  rest-client:
    connect-timeout-ms: ${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${REST_CLIENT_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true