server:
  port: ${PAYMENT_SERVICE_PORT:8084}
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

momo:
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
  refund-endpoint: ${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}
  return-url: ${MOMO_RETURN_URL:http://localhost:3000/payment-result}
  notify-url: ${MOMO_NOTIFY_URL}

app:
  gateway-secret: ${GATEWAY_SECRET}
  internal-secret: ${INTERNAL_SECRET}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8083/api/v1/auth}
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082/api/v1/booking}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  payment-retry:
    fixed-delay-ms: ${PAYMENT_RETRY_FIXED_DELAY_MS:60000}
    max-retry-count: ${PAYMENT_RETRY_MAX_COUNT:10}
  rest-client:
    connect-timeout-ms: ${REST_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${REST_CLIENT_READ_TIMEOUT_MS:5000}
  rabbitmq:
    exchange: movie.ticket.exchange
    booking-paid-queue: notification.booking.paid.queue
    booking-paid-routing-key: notification.booking.paid
    booking-confirm-request-queue: booking.confirm.request.queue
    booking-confirm-request-routing-key: booking.confirm.request
    booking-confirm-result-queue: payment.booking.confirm.result.queue
    booking-confirm-result-routing-key: payment.booking.confirm.result

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      internal:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: false
  retry:
    instances:
      internal:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
