server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://host.docker.internal:8083
          predicates:
            - Path=/api/v1/auth/**

        - id: catalog-service
          uri: http://host.docker.internal:8081
          predicates:
            - Path=/api/v1/catalog/**

        - id: booking-service
          uri: http://host.docker.internal:8082
          predicates:
            - Path=/api/v1/booking/**