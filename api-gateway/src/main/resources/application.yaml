server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    discovery:
      # Chưa dùng service discovery (Eureka/Consul) — tắt health indicator luôn báo "UNKNOWN"
      client:
        health-indicator:
          enabled: false
        composite-indicator:
          enabled: false
    gateway:
      routes:
        # Đích route là base host:port (KHÔNG kèm path) — biến *_SERVICE_URI riêng,
        # tách khỏi *_SERVICE_URL (có path) mà các service dùng để gọi nội bộ.
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://host.docker.internal:8083}
          predicates:
            - Path=/api/v1/auth/**

        - id: catalog-service-public-get
          uri: ${CATALOG_SERVICE_URI:http://host.docker.internal:8081}
          predicates:
            - Path=/api/v1/catalog/movies/**,/api/v1/catalog/cinemas/**,/api/v1/catalog/showtimes/**,/api/v1/catalog/reviews/**
            - Method=GET

        - id: catalog-service-protected-get
          uri: ${CATALOG_SERVICE_URI:http://host.docker.internal:8081}
          predicates:
            - Path=/api/v1/catalog/rooms/**,/api/v1/catalog/snacks/**,/api/v1/catalog/snack-combos/**,/api/v1/catalog/favorites/**
            - Method=GET
          filters:
            - AuthenticationFilter

        - id: catalog-service-protected-write
          uri: ${CATALOG_SERVICE_URI:http://host.docker.internal:8081}
          predicates:
            - Path=/api/v1/catalog/**
            - Method=POST,PUT,PATCH,DELETE
          filters:
            - AuthenticationFilter

        - id: booking-service
          uri: ${BOOKING_SERVICE_URI:http://host.docker.internal:8082}
          predicates:
            - Path=/api/v1/booking/**
          filters:
            - AuthenticationFilter

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://host.docker.internal:8084}
          predicates:
            - Path=/api/v1/payment/**
          filters:
            - AuthenticationFilter

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://host.docker.internal:8085}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter

  movie:
    jwt:
      secret: ${JWT_SECRET}
      expirationMs: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  gateway-secret: ${GATEWAY_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}